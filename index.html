<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ghi Nhận Phúng Viếng</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    h2 { margin: 0 0 18px 0; text-align: center; color: #202124; font-size: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #3c4043; }
    input {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1.5px solid #dadce0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #1a73e8; }
    button {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:active { background: #1557b0; }
    #status {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Ghi Nhận Phúng Viếng</h2>
  
  <div class="form-group">
    <label for="name">1. Người viếng</label>
    <input type="text" id="name" placeholder="Ví dụ: Chú Bảy, Nguyễn Văn A" autofocus autocomplete="off">
  </div>

  <div class="form-group">
    <label for="amount">2. Số tiền viếng (VNĐ)</label>
    <input type="number" id="amount" placeholder="Ví dụ: 500000" inputmode="numeric" autocomplete="off">
  </div>

  <div class="form-group">
    <label for="host">3. Khách của ai</label>
    <input type="text" id="host" placeholder="Ví dụ: Bạn Ba, Bạn Triết, Bà con Mẹ" autocomplete="off">
  </div>

  <button type="button" id="submitBtn" onclick="submitData()">LƯU TIẾP (ENTER)</button>
  <div id="status"></div>
</div>

<script>
  // DÁN URL BẠN VỪA SAO CHÉP VÀO GIỮA 2 DẤU NGOẶC KÉP DƯỚI ĐÂY:
  const SCRIPT_URL = https://script.google.com/macros/s/AKfycbwx-uF1tmuDJtRF0noB_mBIgYSJvant0ZVr9jBEGPSMQABTkZB3rEC4Qn-fI3vCj7aY/exec;

  const nameInput = document.getElementById('name');
  const amountInput = document.getElementById('amount');
  const hostInput = document.getElementById('host');
  const statusDiv = document.getElementById('status');

  nameInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      amountInput.focus();
    }
  });

  amountInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      hostInput.focus();
    }
  });

  hostInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitData();
    }
  });

  function submitData() {
    const name = nameInput.value.trim();
    const amount = amountInput.value.trim();
    const host = hostInput.value.trim();

    if (!name || !amount) {
      statusDiv.style.color = '#d93025';
      statusDiv.innerText = "Chưa nhập tên người viếng hoặc số tiền!";
      if (!name) nameInput.focus();
      else amountInput.focus();
      return;
    }

    statusDiv.style.color = '#137333';
    statusDiv.innerText = `Đã ghi: ${name} (${Number(amount).toLocaleString('vi-VN')} đ)`;

    nameInput.value = '';
    amountInput.value = '';
    hostInput.value = '';
    nameInput.focus();

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, amount: amount, host: host || "Không rõ" })
    }).catch(err => {
      console.error("Lỗi gửi:", err);
    });
  }
</script>

</body>
</html>
